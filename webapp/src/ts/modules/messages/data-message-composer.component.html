<form class="data-message-composer" (ngSubmit)="submit()">
  <div class="form-group">
    <label for="data-message-draft" class="sr-only">{{ 'messages.data.draft' | translate }}</label>
    <textarea id="data-message-draft" class="form-control" name="draft"
              [(ngModel)]="draft" [disabled]="disabled()" [readonly]="sending"
              (ngModelChange)="feedback = undefined"></textarea>
  </div>
  <button class="btn btn-primary" type="submit" [disabled]="disabled() || sending || !draft.trim()">
    {{ 'Send' | translate }}
  </button>
  @if (feedback === 'waiting' || feedback === 'sent') {
    <p role="status">{{ ('messages.data.delivery.' + feedback) | translate }}</p>
  } @else if (feedback) {
    <p role="alert">{{ ('messages.data.delivery.' + feedback) | translate }}</p>
  }
</form>
